<script>
(function () {
  // --vh: 실제로 보이는 화면 높이의 1%. 모바일 vh는 주소창이 숨은 높이 기준이라 위치가 밀려 올라감
  var set = function () {
    var h = window.innerHeight || document.documentElement.clientHeight;
    document.documentElement.style.setProperty("--vh", (h / 100) + "px");
  };
  set();
  window.addEventListener("resize", set);
  window.addEventListener("orientationchange", set);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", set);
})();
</script>

<script src="../a11y.js"></script>

button:focus-visible { outline: 3px solid rgb(20,20,20); outline-offset: 2px; box-shadow: 0 0 0 5px rgb(255,255,255); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; animation-delay: 0s !important; transition-duration: 0.001ms !important; } }
