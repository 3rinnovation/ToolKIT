<div style="height:100dvh;min-height:100dvh;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 0%, #eaf7ee 0%, #d3ecdb 70%);font-family:inherit;">

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:900},&quot;roundTime&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;min&quot;:10,&quot;max&quot;:90,&quot;unit&quot;:&quot;초&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;게임 설정&quot;},&quot;spawnRate&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.6,&quot;max&quot;:1.8,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;게임 설정&quot;},&quot;smileSensitivity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.6,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;게임 설정&quot;}}">
class Component extends DCLogic {
  state = { screen: 'start', score: 0, caught: 0, missed: 0, maxCombo: 0, stars: 0, comfort: '', streak: 1, points: 50, muted: false };

  constructor(props){
    super(props);
    this.videoRef = React.createRef();
    this.fieldRef = React.createRef();
    this.beamRef = React.createRef();
    this.gaugeRef = React.createRef();
    this.timerRef = React.createRef();
    this.scoreRef = React.createRef();
    this.comboRef = React.createRef();
    this.comboNumRef = React.createRef();
    this.cloudRef = React.createRef();
    this.dustRef = React.createRef();
    this.hintRef = React.createRef();
    this.badgeRef = React.createRef();
    this.spritesRef = React.createRef();
    this.stageRef = React.createRef();
    this.audioRef = React.createRef();
    this.otterRef = React.createRef();
    this.otterImgRef = React.createRef();
    this.bubbleRef = React.createRef();
    this.bubbleBoxRef = React.createRef();
    this.bubbleTxtRef = React.createRef();
    this.bubbleTailRef = React.createRef();
    this.camPhRef = React.createRef();
    this.slots = [{x:.012,y:.235,r:-8},{x:.018,y:.415,r:7},{x:.738,y:.225,r:8},{x:.745,y:.39,r:-6},{x:.738,y:.555,r:6}];
    this.bubbleThemes = { blue:['#e6f0ff','#9dbcf0','#3c63b8'], green:['#e3f7e6','#8fd6a0','#2e7d52'], pink:['#ffe8ec','#f4a9b6','#a24a5c'], cream:['#fff6e2','#f3cf86','#6a5230'] };
    this.words = ['마감','눈치','비교','걱정','잔소리','실수','미룸','번아웃','발표','돈 걱정','미래 불안','완벽주의','SNS 비교','시험','후회','피로','불면','조급함','답장 압박','평가'];
    this.relief = ['후~','휴~','뿅','팟','안녕~','스르륵'];
    this.colors = ['#9aa0b4','#a7a2b8','#96a2ac','#aba0a6','#9ba7b0'];
  }

  componentWillUnmount(){ document.removeEventListener('pointerdown', this._onBtnDown, true); this.cleanup(); this.stopMusic(); window.removeEventListener('resize', this.fitStage); if (this._ro) { this._ro.disconnect(); this._ro = null; } }

  fitStage = () => {
    const el = this.stageRef.current; if (!el) return;
    const de = document.documentElement, vw = de.clientWidth, vh = de.clientHeight;
    if (!vw || !vh) return;
    el.style.transform = 'scale(' + Math.min(vw / 430, vh / 900) + ')';
  };

  playClick = () => {
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const ctx = this._ac || (this._ac = new AC());
      if (ctx.state === 'suspended') ctx.resume();
      const t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(620, t);
      o.frequency.exponentialRampToValueAtTime(1180, t + 0.08);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.32, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.18);
    } catch(e) {}
  };
  _onBtnDown = (e) => { if (e.target && e.target.closest && e.target.closest('button')) this.playClick(); };

  componentDidMount(){
    document.addEventListener('pointerdown', this._onBtnDown, true);
    this.fitStage(); requestAnimationFrame(this.fitStage); setTimeout(this.fitStage, 120);
    window.addEventListener('resize', this.fitStage);
    if (window.ResizeObserver) { this._ro = new ResizeObserver(this.fitStage); this._ro.observe(document.documentElement); }
    const hp = (typeof location !== 'undefined' ? location.hash : '').replace(/^#/, '');
    const q = new URLSearchParams(hp);
    this.preview = q.get('preview') === '1' || !!this.props.previewMode;
    const scr = this.props.initialScreen || q.get('screen');
    if (!scr || scr === 'start') return;
    if (scr === 'result') {
      this.setState({ screen: 'result', score: 88, caught: 24, maxCombo: 9, stars: 4, streak: 3, points: 50,
        comfort: '오늘도 활짝 웃었네요. 불안은 잠시 왔다 가는 먼지일 뿐이에요. 지금 그 미소, 오래 기억해요.' });
      return;
    }
    this.setState({ screen: scr }, () => {
      if (scr !== 'play') return;
      if (this.preview) this.seedPreviewPlay(); else this.startGame();
    });
  }

  // static, camera-free play frame for embedding in the handoff board
  seedPreviewPlay(){
    this.initRound();
    const g = this.g; g.spawnT = 999; g.time = 16; g.caught = 2; g.smile = .62;
    if (this.timerRef.current) this.timerRef.current.textContent = '33.0';
    if (this.scoreRef.current) this.scoreRef.current.textContent = '30';
    if (this.cloudRef.current) this.cloudRef.current.textContent = '2/15';
    if (this.gaugeRef.current) this.gaugeRef.current.style.width = '62%';
    for (let i = 0; i < 5; i++) this.makeMonster(i);
    this.setOtterPose('run');
    this.setBubble('잘하고 있어요!', 'green');
  }

  goMission = () => { this.startMusic(); this.setState({ screen: 'mission' }); };

  startMusic(){
    const a = this.audioRef.current; if (!a) return;
    a.volume = this.state.muted ? 0 : 0.45;
    a.play().catch(()=>{});
  }
  stopMusic(){ const a = this.audioRef.current; if (a) { a.pause(); a.currentTime = 0; } }
  toggleMute = () => {
    const muted = !this.state.muted; this.setState({ muted });
    const a = this.audioRef.current;
    if (a) { a.volume = muted ? 0 : 0.45; if (!muted && a.paused) a.play().catch(()=>{}); }
  };
  goHome = () => { this.cleanup(); this.setState({ screen: 'start' }); };
  goPlayCamera = () => this.setState({ screen: 'play' }, () => this.startGame());
  replay = () => this.setState({ screen: 'play' }, () => this.startGame());

  shareResult = async () => {
    const txt = `불안몬 잡기에서 호감도 ${this.state.score}점! 오늘도 활짝 웃었어요 😊 같이 웃어볼래요?`;
    try {
      if (navigator.share) { await navigator.share({ title: '불안몬 잡기', text: txt }); return; }
      if (navigator.clipboard) { await navigator.clipboard.writeText(txt); }
      alert('결과를 복사했어요!\n\n' + txt);
    } catch(e) {}
  };

  cleanup(){
    if (this.raf) clearInterval(this.raf);
    this.raf = null;
    if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
    if (this._onDown) { const f = this.fieldRef.current; if (f) { f.removeEventListener('pointerdown', this._onDown); window.removeEventListener('pointerup', this._onUp); } }
  }

  async initFace(){
    if (this.faceLandmarker) return;
    try {
      const V = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.6/vision_bundle.mjs');
      const fs = await V.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.6/wasm');
      this.faceLandmarker = await V.FaceLandmarker.createFromOptions(fs, {
        baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate: 'GPU' },
        outputFaceBlendshapes: true, runningMode: 'VIDEO', numFaces: 1
      });
    } catch(e) { this.faceLandmarker = null; }
  }

  loadSprites(){
    const sp = {}; const c = this.spritesRef.current;
    if (c) c.querySelectorAll('img[data-k]').forEach(i => { sp[i.getAttribute('data-k')] = i.src; });
    this.sp = sp;
  }

  initRound(){
    const roundTime = this.props.roundTime ?? 20;
    this.g = { monsters: [], smile: 0, spawnT: 0.3, time: roundTime, elapsed: 0, caught: 0, missed: 0, combo: 0, maxCombo: 0, smileTime: 0, noSmileT: 0,
      hold: false, holdV: 0, demo: true, goal: 15, target: null, ending: false, last: performance.now(),
      otter: { dx: 0, dy: 0, face: 1, cele: 0, pose: '' } };
    this.loadSprites();
    const field = this.fieldRef.current; if (field) field.innerHTML = '';
    this._bk = null;
    if (this.timerRef.current) this.timerRef.current.textContent = roundTime.toFixed(1);
    if (this.scoreRef.current) this.scoreRef.current.textContent = '0';
    if (this.cloudRef.current) this.cloudRef.current.textContent = '0/' + this.g.goal;
    if (this.camPhRef.current) this.camPhRef.current.style.display = 'flex';
    if (this.videoRef.current) this.videoRef.current.style.opacity = '0';
    this.setOtterPose('hold');
    this.setBubble('불안몬을\n잡아봐요!', 'blue');
  }

  startGame(){
    this.cleanup();
    this.initRound();
    const field = this.fieldRef.current;
    this._onDown = () => { if (this.g) this.g.hold = true; };
    this._onUp = () => { if (this.g) this.g.hold = false; };
    if (field) { field.addEventListener('pointerdown', this._onDown); window.addEventListener('pointerup', this._onUp); }
    this.g.last = performance.now();
    this.raf = setInterval(this.tick, 16);
    this.setupCamera();
  }

  async setupCamera(){
    const video = this.videoRef.current;
    try {
      const req = navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 }, audio: false });
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000));
      const stream = await Promise.race([req, timeout]);
      this.stream = stream;
      if (video) {
        video.srcObject = stream; video.play().catch(()=>{});
        video.style.opacity = '1';
        if (this.camPhRef.current) this.camPhRef.current.style.display = 'none';
      }
      await this.initFace();
      if (this.faceLandmarker && this.g) { this.g.demo = false; this.hideBadge(); }
      else this.showBadge();
    } catch(e) {
      if (this.g) this.g.demo = true;
      this.showBadge();
    }
  }

  hideBadge(){ const b = this.badgeRef.current; if (b) b.style.display = 'none'; }
  showBadge(){ const b = this.badgeRef.current; if (b) b.style.display = 'flex'; }

  setOtterPose(k){
    const g = this.g, img = this.otterImgRef.current;
    if (!img || !this.sp || !this.sp[k]) return;
    if (g && g.otter.pose === k) return;
    img.src = this.sp[k]; if (g) g.otter.pose = k;
  }

  setBubble(text, theme){
    const key = text + '|' + theme;
    if (this._bk === key) return; this._bk = key;
    const t = this.bubbleThemes[theme] || this.bubbleThemes.blue;
    const box = this.bubbleBoxRef.current, txt = this.bubbleTxtRef.current, tail = this.bubbleTailRef.current;
    if (!box || !txt) return;
    box.style.background = t[0]; box.style.borderColor = t[1]; txt.style.color = t[2]; txt.textContent = text;
    if (tail) { tail.style.background = t[0]; tail.style.borderRightColor = t[1]; tail.style.borderBottomColor = t[1]; }
    box.style.animation = 'none'; void box.offsetWidth; box.style.animation = 'bubbleIn .35s ease-out both';
  }

  makeMonster(slotIdx){
    const field = this.fieldRef.current, g = this.g; if (!field || !g) return;
    let si = slotIdx;
    if (si == null) {
      const free = this.slots.map((s, i) => i).filter(i => !g.monsters.some(m => !m.dead && m.slot === i));
      if (!free.length) return;
      si = free[Math.floor(Math.random() * free.length)];
    }
    const s = this.slots[si];
    const W = field.clientWidth, H = field.clientHeight;
    const w = Math.round(W * 0.25), hh = Math.round(w * 218 / 252);
    const x = Math.round(s.x * W), y = Math.round(s.y * H);
    const word = this.words[Math.floor(Math.random() * this.words.length)];
    const fs = word.length <= 2 ? 21 : word.length <= 3 ? 17 : word.length <= 4 ? 14 : 12;
    const el = document.createElement('div');
    el.style.cssText = 'position:absolute;left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + hh + 'px;animation:popIn .4s ease-out both;';
    const dur = (2.3 + Math.random() * 0.9).toFixed(2), del = (-Math.random() * 2).toFixed(2);
    el.innerHTML =
      '<div style="width:100%;height:100%;animation:monFloat ' + dur + 's ease-in-out ' + del + 's infinite;">' +
        '<div class="b" style="position:relative;width:100%;height:100%;transform:rotate(' + s.r + 'deg);">' +
          '<img class="s" src="' + this.sp.board + '" alt="불안몬" style="width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 6px 8px rgba(60,40,20,.28));" />' +
          '<div class="l" style="position:absolute;left:8%;right:6%;top:55%;height:36%;display:flex;align-items:center;justify-content:center;">' +
            '<span style="font-family:Jua,sans-serif;font-size:' + fs + 'px;line-height:1;color:#5b4430;white-space:nowrap;">' + word + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    field.appendChild(el);
    const maxHp = 1.25 + Math.random() * 0.45;
    g.monsters.push({ el, body: el.querySelector('.b'), spr: el.querySelector('.s'), lbl: el.querySelector('.l'), slot: si, x, y, w, h: hh, r: s.r, hp: maxHp, maxHp, age: 0, dead: false, dying: false });
  }

  catchMon(m){
    const g = this.g; m.dying = true;
    g.caught++; g.combo++; if (g.combo > g.maxCombo) g.maxCombo = g.combo;
    if (this.scoreRef.current) this.scoreRef.current.textContent = String(g.caught * 10 + g.maxCombo * 5);
    if (this.cloudRef.current) this.cloudRef.current.textContent = g.caught + '/' + g.goal;
    if (g.combo >= 2 && this.comboRef.current) {
      this.comboRef.current.style.opacity = '1';
      if (this.comboNumRef.current) this.comboNumRef.current.textContent = '+' + g.combo;
      clearTimeout(this._comboT); this._comboT = setTimeout(() => { if (this.comboRef.current) this.comboRef.current.style.opacity = '0'; }, 900);
    }
    g.otter.cele = 0.75;
    if (m.spr) m.spr.src = this.sp.ko;
    if (m.lbl) m.lbl.style.display = 'none';
    if (m.body) m.body.style.transform = 'rotate(0deg) scale(1.05)';
    const field = this.fieldRef.current;
    const cx = m.x + m.w / 2, cy = m.y + m.h / 2;
    setTimeout(() => {
      if (!field) return;
      const sm = document.createElement('img'); sm.src = this.sp.smoke;
      sm.style.cssText = 'position:absolute;left:' + (cx - 48) + 'px;top:' + (cy - 46) + 'px;width:96px;pointer-events:none;animation:poof .6s ease-out forwards;';
      field.appendChild(sm); setTimeout(() => sm.remove(), 620);
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI * 2 * i) / 6 + Math.random() * .4, d = 40 + Math.random() * 22;
        const st = document.createElement('img'); st.src = this.sp.star;
        st.style.cssText = 'position:absolute;left:' + (cx - 10) + 'px;top:' + (cy - 10) + 'px;width:' + (14 + Math.random() * 10) + 'px;pointer-events:none;--dx:' + (Math.cos(a) * d) + 'px;--dy:' + (Math.sin(a) * d) + 'px;animation:sparkOut .7s ease-out forwards;';
        field.appendChild(st); setTimeout(() => st.remove(), 720);
      }
      const f = document.createElement('div'); f.textContent = '+10';
      f.style.cssText = 'position:absolute;left:' + cx + 'px;top:' + (cy - 30) + 'px;transform:translateX(-50%);color:#2f9e57;font-family:Jua,sans-serif;font-size:22px;text-shadow:0 2px 0 #fff,0 0 6px #fff;animation:floatUp .9s ease-out forwards;pointer-events:none;';
      field.appendChild(f); setTimeout(() => f.remove(), 920);
      m.el.style.animation = 'poof .4s ease-out forwards';
      setTimeout(() => { m.el.remove(); m.dead = true; }, 400);
    }, 380);
    if (g.caught >= g.goal && !g.ending) { g.ending = true; setTimeout(() => { if (this.g === g) this.endGame(); }, 1100); }
  }

  escape(m){
    const g = this.g; m.dying = true; g.missed++; g.combo = 0;
    if (this.comboRef.current) this.comboRef.current.style.opacity = '0';
    m.el.style.transition = 'opacity .5s, transform .5s'; m.el.style.opacity = '0'; m.el.style.transform = 'translateY(-34px) scale(.85)';
    setTimeout(() => { m.el.remove(); m.dead = true; }, 520);
  }

  tick = () => {
    if (!this.g) return;
    const now = performance.now(), g = this.g;
    const dt = Math.min(0.05, (now - g.last) / 1000); g.last = now;
    const field = this.fieldRef.current; if (!field) return;
    const sens = this.props.smileSensitivity ?? 1, rate = this.props.spawnRate ?? 1;

    let face = 0;
    const video = this.videoRef.current;
    if (this.faceLandmarker && video && video.readyState >= 2) {
      try {
        const res = this.faceLandmarker.detectForVideo(video, now);
        const bs = res && res.faceBlendshapes && res.faceBlendshapes[0];
        if (bs) { let l = 0, r = 0; for (const c of bs.categories) { if (c.categoryName === 'mouthSmileLeft') l = c.score; else if (c.categoryName === 'mouthSmileRight') r = c.score; } face = ((l + r) / 2) * 1.7; }
      } catch(e) {}
    }
    g.holdV = g.hold ? Math.min(1, g.holdV + dt * 3) : Math.max(0, g.holdV - dt * 4);
    let target = Math.max(face * sens, g.holdV);
    if (g.demo) target = Math.max(target, Math.sin(now / 700) * 0.55 + 0.45);
    target = Math.min(1, target);
    g.smile += (target - g.smile) * Math.min(1, dt * 9);
    const smile = g.smile, smiling = smile > 0.4;
    if (this.gaugeRef.current) this.gaugeRef.current.style.width = (smile * 100).toFixed(1) + '%';
    if (this.beamRef.current) this.beamRef.current.style.opacity = smiling ? String(((smile - 0.4) / 0.6 * 0.9 + 0.1).toFixed(2)) : '0';
    if (smiling) { g.smileTime += dt; g.noSmileT = 0; } else g.noSmileT += dt;

    // spawn into free slots
    g.spawnT -= dt;
    const alive = g.monsters.filter(m => !m.dead && !m.dying);
    if (g.spawnT <= 0 && !g.ending) {
      if (alive.length < this.slots.length) this.makeMonster();
      g.spawnT = alive.length < 2 ? 0.35 : Math.max(0.8, (1.7 - g.elapsed * 0.02) / rate);
    }

    // target = monster waiting the longest
    if (!g.target || g.target.dying || g.target.dead) g.target = alive.reduce((a, m) => (!a || m.age > a.age) ? m : a, null);
    for (const m of alive) { m.age += dt; if (m !== g.target && m.age > 12) this.escape(m); }
    const t = g.target;
    if (t && !t.dying) {
      if (smiling) {
        t.hp -= smile * dt * 0.95;
        const k = 1 - Math.max(0, t.hp) / t.maxHp;
        if (t.body) t.body.style.transform = 'rotate(' + (t.r + Math.sin(now / 38) * (3 + k * 9)).toFixed(1) + 'deg) scale(' + (1 - k * 0.12).toFixed(3) + ')';
        if (t.hp <= 0) this.catchMon(t);
      } else if (t.body) t.body.style.transform = 'rotate(' + t.r + 'deg)';
    }
    g.monsters = g.monsters.filter(m => !m.dead);

    // otter: dash toward the target and swing the net while smiling
    const o = g.otter, box = this.otterRef.current;
    if (box) {
      const fw = field.clientWidth, bw = box.offsetWidth, bh = box.offsetHeight, bx = box.offsetLeft, by = box.offsetTop;
      let tx = 0, ty = 0, face = 1;
      const chasing = smiling && t && !t.dying;
      if (chasing) {
        const cx = t.x + t.w / 2, cy = t.y + t.h / 2;
        face = cx < fw / 2 ? -1 : 1;
        const nx = face > 0 ? bx + bw * 0.8 : bx + bw * 0.2, ny = by + bh * 0.2;
        tx = Math.max(-30, Math.min(150, (cx - nx) * 0.55));
        ty = Math.max(-200, Math.min(10, (cy - ny) * 0.55));
      }
      o.dx += (tx - o.dx) * Math.min(1, dt * 4.5);
      o.dy += (ty - o.dy) * Math.min(1, dt * 4.5);
      o.face = face;
      let rot, bob = 0, hop = 0, pose;
      if (o.cele > 0) {
        o.cele -= dt; hop = -Math.abs(Math.sin(o.cele * 9)) * 16; rot = Math.sin(now / 120) * 4;
        pose = g.caught % 2 ? 'wink' : 'fist';
      } else if (chasing) {
        rot = Math.sin(now / 95) * 15; pose = Math.floor(now / 170) % 2 ? 'run' : 'run2';
      } else {
        rot = Math.sin(now / 650) * 2.5; bob = Math.sin(now / 420) * 4; pose = 'hold';
      }
      this.setOtterPose(pose);
      box.style.transform = 'translate(' + o.dx.toFixed(1) + 'px,' + (o.dy + bob + hop).toFixed(1) + 'px) rotate(' + rot.toFixed(2) + 'deg) scaleX(' + o.face + ')';
      if (this.bubbleRef.current) this.bubbleRef.current.style.transform = 'translate(' + o.dx.toFixed(1) + 'px,' + (o.dy + bob + hop).toFixed(1) + 'px)';
    }

    // otter speech bubble
    if (g.elapsed < 2.4) this.setBubble('불안몬을\n잡아봐요!', 'blue');
    else if (smiling) this.setBubble('잘하고 있어요!', 'green');
    else if (g.noSmileT > 1.6) this.setBubble('조금만 더\n미소 지어볼까요?', 'pink');

    g.time -= dt; g.elapsed += dt;
    if (this.timerRef.current) this.timerRef.current.textContent = Math.max(0, g.time).toFixed(1);
    if (g.time <= 0) { this.endGame(); return; }
  };

  endGame(){
    const g = this.g; this.cleanup();
    const caught = g.caught, smileT = g.smileTime;
    let fav = Math.round(Math.min(100, 42 + caught * 2.6 + smileT * 1.3));
    if (caught === 0) fav = Math.max(18, fav - 22);
    const stars = fav >= 90 ? 5 : fav >= 74 ? 4 : fav >= 56 ? 3 : fav >= 36 ? 2 : 1;
    let comfort;
    if (fav >= 74) comfort = '오늘도 활짝 웃었네요. 불안은 잠시 왔다 가는 먼지일 뿐이에요. 지금 그 미소, 오래 기억해요.';
    else if (fav >= 46) comfort = '잘하고 있어요. 웃는 연습만으로도 마음이 한결 가벼워졌어요.';
    else comfort = '괜찮아요. 여기까지 온 것만으로 충분해요. 내일 다시 함께 웃어요.';

    // streak (localStorage)
    let streak = 1;
    try {
      const today = new Date().toDateString();
      const last = localStorage.getItem('anxmon_last');
      const yday = new Date(Date.now() - 86400000).toDateString();
      let prev = parseInt(localStorage.getItem('anxmon_streak') || '0', 10) || 0;
      if (last === today) streak = prev || 1;
      else { streak = (last === yday) ? prev + 1 : 1; localStorage.setItem('anxmon_last', today); localStorage.setItem('anxmon_streak', String(streak)); }
    } catch(e) {}

    this.setState({ screen: 'result', score: fav, caught, missed: g.missed, maxCombo: g.maxCombo, stars, comfort, streak, points: 50 });
  }

  renderVals(){
    const s = this.state;
    const starList = [1,2,3,4,5].map(i => ({ color: i <= s.stars ? '#ffc93c' : '#dfe6e0' }));
    const palette = ['#ffd451','#4fc487','#7ec8f0','#f5776a','#a78bd0'];
    const confetti = Array.from({ length: 14 }, (_, i) => ({
      left: (5 + Math.random() * 90).toFixed(1) + '%',
      color: palette[i % palette.length],
      dur: (1.6 + Math.random() * 1.4).toFixed(2) + 's',
      delay: (Math.random() * 1.2).toFixed(2) + 's'
    }));
    return {
      isStart: s.screen === 'start', isMission: s.screen === 'mission', isPlay: s.screen === 'play', isResult: s.screen === 'result',
      goMission: this.goMission, goHome: this.goHome, goPlayCamera: this.goPlayCamera, replay: this.replay, shareResult: this.shareResult,
      videoRef: this.videoRef, fieldRef: this.fieldRef, beamRef: this.beamRef, gaugeRef: this.gaugeRef,
      timerRef: this.timerRef, scoreRef: this.scoreRef, comboRef: this.comboRef, comboNumRef: this.comboNumRef,
      hintRef: this.hintRef, badgeRef: this.badgeRef, cloudRef: this.cloudRef, dustRef: this.dustRef,
      spritesRef: this.spritesRef, stageRef: this.stageRef, audioRef: this.audioRef,
      showMute: s.screen !== 'start', muteIcon: s.muted ? '🔇' : '🔊', toggleMute: this.toggleMute, otterRef: this.otterRef, otterImgRef: this.otterImgRef, bubbleRef: this.bubbleRef, bubbleBoxRef: this.bubbleBoxRef, bubbleTxtRef: this.bubbleTxtRef, bubbleTailRef: this.bubbleTailRef, camPhRef: this.camPhRef,
      score: s.score, caught: s.caught, maxCombo: s.maxCombo, comfort: s.comfort, streak: s.streak, points: s.points,
      starList, confetti
    };
  }
}
</script>
