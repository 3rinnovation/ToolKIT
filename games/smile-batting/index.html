:root {
  --color-bg: #f2f2f3;
  --color-surface: #e9e9ea;
  --color-text: #1d1f20;
  --color-accent: #5980a6;
  --color-accent-2: #728fab;
  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f5f5f8;
  --color-neutral-200: #e7e7ea;
  --color-neutral-300: #d4d4d7;
  --color-neutral-400: #b7b7ba;
  --color-neutral-500: #98989b;
  --color-neutral-600: #7a7a7d;
  --color-neutral-700: #5d5d60;
  --color-neutral-800: #424244;
  --color-neutral-900: #2b2b2d;

  --color-accent-100: #eef6ff;
  --color-accent-200: #d6ebff;
  --color-accent-300: #b5d9fd;
  --color-accent-400: #94bce3;
  --color-accent-500: #749dc4;
  --color-accent-600: #597ea3;
  --color-accent-700: #416180;
  --color-accent-800: #2c455d;
  --color-accent-900: #1d2d3d;

  --color-accent-2-100: #eef6ff;
  --color-accent-2-200: #d6ebff;
  --color-accent-2-300: #bdd8f2;
  --color-accent-2-400: #9ebbd8;
  --color-accent-2-500: #7e9cb8;
  --color-accent-2-600: #627d98;
  --color-accent-2-700: #486077;
  --color-accent-2-800: #314457;
  --color-accent-2-900: #1f2d3a;

  --font-heading: "Barlow Condensed", system-ui, sans-serif;
  --font-heading-weight: 600;
  --font-body: "Barlow", system-ui, sans-serif;

  --space-1: 3.4px;
  --space-2: 6.8px;
  --space-3: 10.2px;
  --space-4: 13.6px;
  --space-6: 20.4px;
  --space-8: 27.2px;

  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 7px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.blueprint {
  position: relative;
  border: 1px solid var(--color-divider);
  border-radius: 0;
}
/* The overlay image treatments (halftone, duotone) clip their overlay
   (overflow:hidden); a blueprint wrapper draws its registration marks
   outside the box, so when both classes share a wrapper the frame must
   win. */
.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }
.blueprint > .corner {
  position: absolute; width: 11px; height: 11px;
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.blueprint > .corner::before, .blueprint > .corner::after {
  content: ""; position: absolute; background: currentColor;
}
.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }
.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }
.blueprint > .corner.tl { top: -6px; left: -6px; }
.blueprint > .corner.tr { top: -6px; right: -6px; }
.blueprint > .corner.bl { bottom: -6px; left: -6px; }
.blueprint > .corner.br { bottom: -6px; right: -6px; }

.duotone{position:relative;overflow:hidden}
.duotone::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:var(--color-accent);mix-blend-mode:color}

/* ══════════════════════════════════════════════════════════════════════════
   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — rules — */
.hr {
  height: 1px; border: 0; margin: var(--space-4) 0;
  background: var(--color-divider);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* — cards — */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* — tags — */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — navigation — */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: none;
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);
}
.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }

/* — dialog — */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:940},&quot;roundSeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;min&quot;:5,&quot;max&quot;:60,&quot;step&quot;:5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Game&quot;},&quot;gaugeStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bar&quot;,&quot;blocks&quot;,&quot;tug&quot;,&quot;dots&quot;,&quot;pixel&quot;,&quot;dual&quot;],&quot;default&quot;:&quot;bar&quot;,&quot;tsType&quot;:&quot;'bar' | 'blocks' | 'tug' | 'dots' | 'pixel' | 'dual'&quot;,&quot;section&quot;:&quot;Game&quot;}}">
class Component extends DCLogic {
  state = { screen: 'title', prev: 'title', count: 3, left: 20, pct: 50, music: false, p1: '', p2: '', warn: '' };

  videoA = React.createRef();
  videoB = React.createRef();
  videoP = React.createRef();

  async openCamera() {
    if (this._stream) { this.attachVideos(); return true; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      this.setState({ camError: '이 브라우저에서는 카메라를 쓸 수 없어요. 크롬/사파리 최신 버전에서 열어주세요.' });
      return false;
    }
    try {
      this._stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      this.setState({ camOn: true, camError: '' }, () => this.attachVideos());
      return true;
    } catch (e) {
      const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      this.setState({
        camOn: false,
        camError: denied
          ? '카메라 권한이 거부됐어요. 주소창의 카메라 아이콘에서 허용으로 바꿔주세요.'
          : '카메라를 찾을 수 없어요. 다른 앱이 사용 중인지 확인해 주세요.'
      });
      return false;
    }
  }

  attachVideos() {
    [this.videoA, this.videoB, this.videoP].forEach(r => {
      const el = r.current;
      if (el && this._stream && el.srcObject !== this._stream) {
        el.srcObject = this._stream;
        const p = el.play();
        if (p && p.catch) p.catch(() => {});
      }
    });
  }

  stopCamera() {
    if (this._stream) { this._stream.getTracks().forEach(t => t.stop()); this._stream = null; }
    this.setState({ camOn: false });
  }

  componentDidUpdate() { this.attachVideos(); }

  componentDidMount() {
    this.killStaleAudio();
    this.loadBgm().catch(() => {});
  }

  componentWillUnmount() {
    (this._kickEvents || []).forEach(ev => window.removeEventListener(ev, this._kick));
    this.clearTimers();
  }

  clearTimers() {
    if (this._t) { clearInterval(this._t); this._t = null; }
    if (this._g) { clearInterval(this._g); this._g = null; }
    if (this._r) { clearInterval(this._r); this._r = null; }
    if (this._to) { clearTimeout(this._to); this._to = null; }
  }

  ctx() {
    if (!this._ctx) this._ctx = new (window.AudioContext || window.webkitAudioContext)();
    return this._ctx;
  }

  killStaleAudio() {
    document.querySelectorAll('audio').forEach(el => { try { el.pause(); } catch (e) {} });
    document.querySelectorAll('audio[data-bgm]').forEach(el => el.remove());
    if (window.__msBgmNode) { try { window.__msBgmNode.stop(); } catch (e) {} window.__msBgmNode = null; }
    window.__msBgm = null;
  }

  loadBgm() {
    if (window.__msBgmBuf) return Promise.resolve(window.__msBgmBuf);
    if (this._bgmLoading) return this._bgmLoading;
    const inline = document.querySelector('audio[data-bgm-src]');
    const src = (inline && (inline.currentSrc || inline.src || inline.getAttribute('src'))) || 'assets/bgm.mp3';
    this._bgmLoading = fetch(src)
      .then(r => r.arrayBuffer())
      .then(ab => new Promise((res, rej) => this.ctx().decodeAudioData(ab, res, rej)))
      .then(buf => { window.__msBgmBuf = buf; this._bgmLoading = null; return buf; })
      .catch(e => { this._bgmLoading = null; throw e; });
    return this._bgmLoading;
  }

  startMusic() {
    this._userStopped = false;
    const ctx = this.ctx();
    if (ctx.state === 'suspended') ctx.resume();
    if (window.__msBgmNode) { this._playing = true; this.setState({ music: true }); return; }
    this._wantMusic = true;
    this.loadBgm().then(buf => {
      if (!this._wantMusic || window.__msBgmNode) return;
      if (ctx.state === 'suspended') ctx.resume();
      const g = ctx.createGain();
      const v = this.props.musicVolume;
      g.gain.value = Math.max(0.05, Math.min(1, typeof v === 'number' ? v : 0.6));
      const node = ctx.createBufferSource();
      node.buffer = buf;
      node.loop = true;
      node.connect(g).connect(ctx.destination);
      node.start(0);
      window.__msBgmNode = node;
      this._playing = true;
      this.setState({ music: true });
    }).catch(() => { this._playing = false; this.setState({ music: false }); });
  }

  stopMusic() {
    this._playing = false;
    this._userStopped = true;
    this._wantMusic = false;
    if (window.__msBgmNode) { try { window.__msBgmNode.stop(); } catch (e) {} window.__msBgmNode = null; }
    this.setState({ music: false });
  }

  blip(freq, dur) {
    if (this.state.sfxOn === false) return;
    const ctx = this.ctx();
    if (ctx.state === 'suspended') ctx.resume();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(freq, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq * 2, ctx.currentTime + dur);
    g.gain.setValueAtTime(0.22, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0006, ctx.currentTime + dur);
    o.connect(g).connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + dur + 0.02);
  }

  go(screen) {
    this.clearTimers();
    if (screen === 'title' || screen === 'ranking') this.stopCamera();
    this.setState(s => ({ screen: screen, prev: s.screen, warn: '' }));
  }

  runCountdown() {
    this.clearTimers();
    this.setState({ screen: 'count', count: 3, warn: '' });
    this.blip(520, 0.14);
    const tick = () => {
      this.setState(s => {
        if (s.count > 1) { this.blip(520, 0.14); return { count: s.count - 1 }; }
        if (s.count === 1) { this.blip(760, 0.26); return { count: 0 }; }
        return {};
      }, () => {
        if (this.state.count === 0) {
          this._to = setTimeout(() => this.runPlay(), 850);
          if (this._t) { clearInterval(this._t); this._t = null; }
        }
      });
    };
    this._t = setInterval(tick, 900);
  }

  runPlay() {
    this.clearTimers();
    this.setState({ screen: 'play', left: this.props.roundSeconds ?? 30, pct: 50, reactL: '', reactR: '' });
    this._t = setInterval(() => {
      this.setState(s => ({ left: Math.max(0, s.left - 1) }), () => {
        if (this.state.left === 0) { this.clearTimers(); this.blip(880, 0.3); this.forceUpdate(); }
      });
    }, 1000);
    this._g = setInterval(() => {
      const m = this.readMotion();
      this.setState(s => {
        const target = m
          ? 50 + (m.left - m.right) * 140
          : s.pct + (Math.random() - 0.5) * 22;
        const next = s.pct * 0.82 + Math.max(6, Math.min(94, target)) * 0.18;
        return { pct: Math.max(8, Math.min(92, Math.round(next))) };
      });
    }, 120);
    const lines = ['ㅋㅋㅋ', 'ㅎㅎㅎ', '푸흡!', '참아!', '큭…', '터졌다!', '흐흐'];
    this._r = setInterval(() => {
      const t = lines[Math.floor(Math.random() * lines.length)];
      const side = Math.random() < 0.5 ? 'L' : 'R';
      this.setState(side === 'L' ? { reactL: t } : { reactR: t });
      setTimeout(() => this.setState(side === 'L' ? { reactL: '' } : { reactR: '' }), 1000);
    }, 900);
  }

  readMotion() {
    const v = this.videoA && this.videoA.current;
    if (!this._stream || !v || v.readyState < 2 || !v.videoWidth) return null;
    if (!this._mc) {
      this._mc = document.createElement('canvas');
      this._mc.width = 64; this._mc.height = 48;
      this._mx = this._mc.getContext('2d', { willReadFrequently: true });
    }
    const W = 64, H = 48;
    this._mx.drawImage(v, 0, 0, W, H);
    const cur = this._mx.getImageData(0, 0, W, H).data;
    const prev = this._prev;
    let left = 0, right = 0;
    if (prev) {
      for (let y = Math.floor(H * 0.35); y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = (y * W + x) * 4;
          const d = Math.abs(cur[i] - prev[i]) + Math.abs(cur[i + 1] - prev[i + 1]);
          if (x < W / 2) left += d; else right += d;
        }
      }
      const n = (H * 0.65) * (W / 2) * 510;
      left /= n; right /= n;
    }
    this._prev = cur;
    return prev ? { left: Math.min(1, left * 8), right: Math.min(1, right * 8) } : null;
  }

  renderVals() {
    const s = this.state;
    const countSrc = { 3: 'assets/p4/n3.png', 2: 'assets/p4/n2.png', 1: 'assets/p4/n1.png' };
    const mm = String(Math.floor(s.left / 60)).padStart(2, '0');
    const ss = String(s.left % 60).padStart(2, '0');
    return {
      isTitle: s.screen === 'title',
      isNickname: s.screen === 'nickname',
      isCamera: s.screen === 'camera',
      isCount: s.screen === 'count',
      isPlay: s.screen === 'play',
      isResult: s.screen === 'result',
      isRanking: s.screen === 'ranking',
      settingsOpen: !!s.settingsOpen,
      showPreview: !!s.camOn && s.camPrev !== false,
      openSettings: () => { this.blip(620, 0.1); this.setState({ settingsOpen: true }); },
      closeSettings: () => { this.blip(520, 0.1); this.setState({ settingsOpen: false }); },
      goRankingFromSettings: () => { this.blip(700, 0.12); this.setState({ settingsOpen: false }); this.go('ranking'); },
      toggles: [
        { key: 'bgm', label: '배경 음악', top: '36%', on: !this._userStopped && s.bgmOn !== false },
        { key: 'sfx', label: '효과음', top: '43.2%', on: s.sfxOn !== false },
        { key: 'cam', label: '카메라 미리보기', top: '50.4%', on: s.camPrev !== false }
      ].map(t => Object.assign(t, {
        off: !t.on,
        onToggle: () => {
          if (t.key === 'bgm') {
            if (t.on) { this.stopMusic(); this.setState({ bgmOn: false }); }
            else { this.setState({ bgmOn: true }); this.startMusic(); }
          } else if (t.key === 'sfx') {
            this.setState({ sfxOn: !t.on }, () => this.blip(660, 0.1));
          } else {
            this.setState({ camPrev: !t.on });
          }
          this.blip(660, 0.08);
        }
      })),
      isStartCue: s.screen === 'count' && s.count === 0,
      is3: s.screen === 'count' && s.count === 3,
      is2: s.screen === 'count' && s.count === 2,
      is1: s.screen === 'count' && s.count === 1,
      clock: mm + ':' + ss,
      isOver: s.screen === 'play' && s.left === 0,
      pctA: s.pct,
      isBar: (this.props.gaugeStyle ?? 'bar') === 'bar',
      isBlocks: this.props.gaugeStyle === 'blocks',
      isTug: this.props.gaugeStyle === 'tug',
      isDots: this.props.gaugeStyle === 'dots',
      isPixel: this.props.gaugeStyle === 'pixel',
      isDual: this.props.gaugeStyle === 'dual',
      showKnob: this.props.gaugeStyle === 'tug',
      blocks: Array.from({ length: 12 }, (_, i) => ({
        color: (i + 1) * (100 / 12) <= s.pct ? '#4cbb38' : '#f5a623'
      })),
      winner: s.pct >= 50 ? ((s.p1 || '').trim() || '선수 1') : ((s.p2 || '').trim() || '선수 2'),
      loser: s.pct >= 50 ? ((s.p2 || '').trim() || '선수 2') : ((s.p1 || '').trim() || '선수 1'),
      boardImg: s.pct >= 50 ? 'assets/p9/board-1p.png' : 'assets/p9/board-2p.png',
      winIs1P: s.pct >= 50,
      winIs2P: s.pct < 50,
      winTextColor: s.pct >= 50 ? '#0f5c0a' : '#8a5c00',
      loseTextColor: s.pct >= 50 ? '#8a5c00' : '#1f5e18',
      winnerScore: Math.max(s.pct, 100 - s.pct),
      loserScore: Math.min(s.pct, 100 - s.pct),
      myScore: Math.max(s.pct, 100 - s.pct),
      myRank: [98, 94, 91].filter(v => v > Math.max(s.pct, 100 - s.pct)).length + 1,
      board: (() => {
        const my = Math.max(s.pct, 100 - s.pct);
        const tops = [{ n: '루미', v: 98 }, { n: '모던이', v: 94 }, { n: '해피니', v: 91 }];
        const rank = tops.filter(t => t.v > my).length + 1;
        const meName = ((s.pct >= 50 ? (s.p1 || '') : (s.p2 || '')).trim() || '나');
        return [
          { top: '65.6%', name: tops[0].n, score: tops[0].v + '점', color: '#2f8f26' },
          { top: '69.7%', name: tops[1].n, score: tops[1].v + '점', color: '#2c3a2a' },
          { top: '73.8%', name: tops[2].n, score: tops[2].v + '점', color: '#2c3a2a' },
          { top: '80.6%', name: rank + '위 · ' + meName + '(나)', score: my + '점', color: '#2f8f26' }
        ];
      })(),
      name1: (s.p1 || '').trim() || '선수 1',
      name2: (s.p2 || '').trim() || '선수 2',
      reactL: s.reactL || '',
      reactR: s.reactR || '',
      hasReactL: !!s.reactL,
      hasReactR: !!s.reactR,
      pctALabel: s.pct + '%',
      pctBLabel: (100 - s.pct) + '%',
      p1: s.p1, p2: s.p2,
      warned: !!s.warn, warnText: s.warn,
      musicIcon: s.music ? '♪' : '✕',
      bgmLeft: (s.screen === 'title' || s.screen === 'result') ? '3%' : '17.5%',
      showBgm: s.screen !== 'title' && s.screen !== 'count' && s.screen !== 'ranking' && s.screen !== 'result',
      noop: () => this.blip(620, 0.1),
      goTitle: () => { this.blip(300, 0.12); this.go('title'); },
      goNickname: () => {
        this.blip(520, 0.16);
        if (!this._userStopped && this.state.bgmOn !== false) this.startMusic();
        this.go('nickname');
      },
      goCamera: () => { this.blip(300, 0.12); this.go('camera'); },
      goRanking: () => { this.blip(700, 0.12); this.go('ranking'); },
      goResult: () => { this.blip(880, 0.24); this.go('result'); },
      goBackFromRanking: () => { this.blip(300, 0.12); this.go(this.state.prev === 'ranking' ? 'title' : this.state.prev); },
      onP1: e => this.setState({ p1: e.target.value, warn: '' }),
      onP2: e => this.setState({ p2: e.target.value, warn: '' }),
      onConfirm: () => {
        const a = s.p1.trim(), b = s.p2.trim();
        if (a.length < 2 || b.length < 2) { this.blip(220, 0.14); this.setState({ warn: '두 선수 모두 2자 이상 입력해주세요' }); return; }
        this.blip(660, 0.2);
        this.go('camera');
      },
      camOn: !!s.camOn,
      camOff: !s.camOn,
      camError: s.camError || '',
      videoA: this.videoA,
      videoB: this.videoB,
      videoP: this.videoP,
      onCameraBtn: async () => {
        this.blip(660, 0.18);
        if (!this.state.camOn && !this.state.camError) {
          await this.openCamera();
          return;
        }
        this.runCountdown();
      },
      startCountdown: () => this.runCountdown(),
      onToggleMusic: () => {
        if (window.__msBgmNode) this.stopMusic(); else this.startMusic();
      },
      onKick: () => { if (!this._userStopped) this.startMusic(); }
    };
  }
}
</script>
